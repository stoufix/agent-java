openapi: 3.0.3
info:
  title: CV Generator & LLM Processing API
  description: API to generate CV PDFs and process/validate LLM responses
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

paths:

  /cv/generate:
    post:
      summary: Generate CV as PDF
      description: Takes personal information and returns a generated CV PDF file
      operationId: generateCv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CvRequest'
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid input data
        '500':
          description: Internal server error

  /llm/ask:
    post:
      summary: Ask a question to the LLM and get validated response
      description: Processes a question using an LLM and validates the response using other LLMs or tools
      operationId: askQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
      responses:
        '200':
          description: Successfully processed and validated response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error

components:
  schemas:

    # ========================
    # CV SCHEMAS
    # ========================

    CvRequest:
      type: object
      required:
        - personalInfo
        - education
        - experience
        - skills
      properties:
        personalInfo:
          $ref: '#/components/schemas/PersonalInfo'
        summary:
          type: string
        education:
          type: array
          items:
            $ref: '#/components/schemas/Education'
        experience:
          type: array
          items:
            $ref: '#/components/schemas/Experience'
        skills:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        certifications:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'

    PersonalInfo:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        linkedin:
          type: string
          format: uri
        github:
          type: string
          format: uri

    Education:
      type: object
      required:
        - institution
        - degree
        - startDate
      properties:
        institution:
          type: string
        degree:
          type: string
        fieldOfStudy:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        description:
          type: string

    Experience:
      type: object
      required:
        - company
        - position
        - startDate
      properties:
        company:
          type: string
        position:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        responsibilities:
          type: array
          items:
            type: string

    Project:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        technologies:
          type: array
          items:
            type: string
        link:
          type: string
          format: uri

    Language:
      type: object
      properties:
        name:
          type: string
        level:
          type: string

    # ========================
    # LLM SCHEMAS
    # ========================

    QuestionRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          example: "Explain microservices architecture"
        context:
          type: string
        validationRequired:
          type: boolean
          default: true
        maxTokens:
          type: integer
        aiProvider:
          type: string
          enum: [OPENAI, GEMINI, GROQ]
    QuestionResponse:
      type: object
      properties:
        answer:
          type: string
        validated:
          type: boolean
        confidenceScore:
          type: number
          format: float
        validations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    ValidationResult:
      type: object
      properties:
        validator:
          type: string
        status:
          type: string
          enum: [PASSED, FAILED, WARNING]
        score:
          type: number
          format: float
        feedback:
          type: string

    ResponseMetadata:
      type: object
      properties:
        model:
          type: string
        processingTimeMs:
          type: integer
        tokensUsed:
          type: integer
        timestamp:
          type: string
          format: date-time